<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Остров">
<meta name="theme-color" content="#141C10">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>html,body{margin:0;height:100%;background:#000}@media (display-mode:fullscreen),(display-mode:standalone){#bFS,#bFSi{display:none!important}}
#appVer{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(6px,env(safe-area-inset-bottom));font:600 11px system-ui,sans-serif;color:rgba(255,255,255,.35);z-index:50;pointer-events:none}</style>
</head><body>
<script src="three.min.js"></script><script src="GLTFLoader.js"></script><script src="island.js?v=2026.11.21-2137"></script>
<div id="appVer">v2026.11.21-1018</div>
<script>
window.APP_VERSION='2026.11.21-1018';
/* the version label only on the lobby screen */
setInterval(()=>{const l=document.getElementById('lobby'),v=document.getElementById('appVer');if(l&&v)v.style.display=l.hidden?'none':'';},500);
if('serviceWorker' in navigator){let reloaded=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{const l=document.getElementById('lobby');if(reloaded)return;
  /* a new version arrived: reload at once if we're in the lobby, otherwise on the next visit to it */
  const go=()=>{reloaded=true;location.reload();};if(!l||!l.hidden)go();else{const t=setInterval(()=>{if(!l.hidden){clearInterval(t);go();}},1000);}});
 /* a newer version on the site: reload (in the lobby only, never mid-battle) */
 let newer=false;const chk=()=>fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j&&j.v&&j.v!==window.APP_VERSION)newer=true;}).catch(()=>{});
 setInterval(()=>{const l=document.getElementById('lobby');if(newer&&l&&!l.hidden&&!reloaded){reloaded=true;location.reload();}},1000);
 chk();setInterval(chk,60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk();});
 window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>{setInterval(()=>r.update().catch(()=>{}),10*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{});});}).catch(()=>{});});}
</script>
</body></html>
